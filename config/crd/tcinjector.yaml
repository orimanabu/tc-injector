apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tcinjectors.tc-injector.setns.net
spec:
  group: tc-injector.setns.net
  names:
    kind: TCInjector
    listKind: TCInjectorList
    plural: tcinjectors
    singular: tcinjector
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [rules]
              properties:
                enablePeriodicDelayRotation:
                  type: boolean
                  default: false
                  description: >
                    When true, the controller periodically re-randomizes delays within [minDelay, maxDelay]
                    at the interval specified by delayInterval. Defaults to false.
                delayInterval:
                  type: string
                  default: "30s"
                  description: >
                    Interval between periodic delay re-randomizations.
                    Only takes effect when enablePeriodicDelayRotation is true.
                    Accepts Go duration strings (e.g. "30s", "1m", "2m30s"). Defaults to "30s".
                rules:
                  type: array
                  items:
                    type: object
                    required: [selector, minDelay, maxDelay]
                    properties:
                      selector:
                        type: object
                        description: Label selector to match target pods.
                        properties:
                          matchLabels:
                            type: object
                            additionalProperties:
                              type: string
                          matchExpressions:
                            type: array
                            items:
                              type: object
                              required: [key, operator]
                              properties:
                                key:
                                  type: string
                                operator:
                                  type: string
                                  enum: [In, NotIn, Exists, DoesNotExist]
                                values:
                                  type: array
                                  items:
                                    type: string
                      namespaceSelector:
                        type: object
                        description: >
                          Label selector to match target namespaces.
                          Only pods running in matching namespaces are eligible for delay injection.
                          An empty selector matches all namespaces.
                        properties:
                          matchLabels:
                            type: object
                            additionalProperties:
                              type: string
                          matchExpressions:
                            type: array
                            items:
                              type: object
                              required: [key, operator]
                              properties:
                                key:
                                  type: string
                                operator:
                                  type: string
                                  enum: [In, NotIn, Exists, DoesNotExist]
                                values:
                                  type: array
                                  items:
                                    type: string
                      minDelay:
                        type: integer
                        format: int32
                        minimum: 0
                        description: Minimum delay in milliseconds.
                      maxDelay:
                        type: integer
                        format: int32
                        minimum: 0
                        description: Maximum delay in milliseconds. Must be >= minDelay.
                      multusNetworks:
                        type: array
                        description: >
                          Optional list of NetworkAttachmentDefinition names whose pod-side
                          interfaces also receive delay injection. Each entry may be "name"
                          (matches any namespace) or "namespace/name" (exact match).
                          Interfaces are resolved via the k8s.v1.cni.cncf.io/networks-status
                          pod annotation. If omitted, only the primary interface is targeted.
                        items:
                          type: string
            status:
              type: object
              properties:
                injectedPods:
                  type: integer
                  format: int32
                injectedPodDetails:
                  type: array
                  description: Details of tc rules currently applied on this node.
                  items:
                    type: object
                    required: [nodeName, namespace, podName, interface, interfaceIndex, delayMs, tcCommand]
                    properties:
                      nodeName:
                        type: string
                        description: Node where the rule is applied.
                      namespace:
                        type: string
                        description: Namespace of the target pod.
                      podName:
                        type: string
                        description: Name of the target pod.
                      interface:
                        type: string
                        description: Host-side network interface name.
                      interfaceIndex:
                        type: integer
                        format: int32
                        description: ifindex of the host-side interface.
                      delayMs:
                        type: integer
                        format: int32
                        description: Injected delay in milliseconds.
                      tcCommand:
                        type: string
                        description: The tc command line that was applied.
                      multusInterfaces:
                        type: array
                        description: tc rules applied to Multus-managed interfaces of this pod.
                        items:
                          type: object
                          required: [nadName, interface, delayMs, tcCommand]
                          properties:
                            nadName:
                              type: string
                              description: NetworkAttachmentDefinition identifier (namespace/name) from the Multus annotation.
                            interface:
                              type: string
                              description: Interface name inside the pod (e.g. net1).
                            delayMs:
                              type: integer
                              format: int32
                              description: Injected delay in milliseconds.
                            tcCommand:
                              type: string
                              description: The tc command line that was applied.
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      additionalPrinterColumns:
        - name: Rules
          type: integer
          jsonPath: .spec.rules[*]
        - name: Injected
          type: integer
          jsonPath: .status.injectedPods
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
