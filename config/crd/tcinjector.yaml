apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tcinjectors.tc-injector.example.com
spec:
  group: tc-injector.example.com
  names:
    kind: TCInjector
    listKind: TCInjectorList
    plural: tcinjectors
    singular: tcinjector
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [rules]
              properties:
                enablePeriodicDelayRotation:
                  type: boolean
                  default: false
                  description: >
                    When true, the controller periodically re-randomizes delays within [minDelay, maxDelay]
                    at the interval specified by delayInterval. Defaults to false.
                delayInterval:
                  type: string
                  default: "30s"
                  description: >
                    Interval between periodic delay re-randomizations.
                    Only takes effect when enablePeriodicDelayRotation is true.
                    Accepts Go duration strings (e.g. "30s", "1m", "2m30s"). Defaults to "30s".
                rules:
                  type: array
                  items:
                    type: object
                    required: [selector, minDelay, maxDelay]
                    properties:
                      selector:
                        type: object
                        description: Label selector to match target pods.
                        properties:
                          matchLabels:
                            type: object
                            additionalProperties:
                              type: string
                          matchExpressions:
                            type: array
                            items:
                              type: object
                              required: [key, operator]
                              properties:
                                key:
                                  type: string
                                operator:
                                  type: string
                                  enum: [In, NotIn, Exists, DoesNotExist]
                                values:
                                  type: array
                                  items:
                                    type: string
                      minDelay:
                        type: integer
                        format: int32
                        minimum: 0
                        description: Minimum delay in milliseconds.
                      maxDelay:
                        type: integer
                        format: int32
                        minimum: 0
                        description: Maximum delay in milliseconds. Must be >= minDelay.
            status:
              type: object
              properties:
                injectedPods:
                  type: integer
                  format: int32
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      additionalPrinterColumns:
        - name: Rules
          type: integer
          jsonPath: .spec.rules[*]
        - name: Injected
          type: integer
          jsonPath: .status.injectedPods
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
