apiVersion: tc-injector.example.com/v1alpha1
kind: TCInjector
metadata:
  name: example-delay
spec:
  rules:
    # Add 10–50 ms delay to all pods labeled app=backend.
    - selector:
        matchLabels:
          app: backend
      minDelay: 10
      maxDelay: 50

    # Add 100–200 ms delay to pods with role=slow regardless of app.
    - selector:
        matchLabels:
          role: slow
      minDelay: 100
      maxDelay: 200

    # Use matchExpressions for more complex selectors.
    - selector:
        matchExpressions:
          - key: environment
            operator: In
            values: [staging, canary]
      minDelay: 5
      maxDelay: 30
