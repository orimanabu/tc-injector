apiVersion: tc-injector.setns.net/v1alpha1
kind: TCInjector
metadata:
  name: example-delay
spec:
  rules:
    # Add 10–50 ms delay to pods labeled app=backend running in namespaces labeled env=production.
    - selector:
        matchLabels:
          app: backend
      namespaceSelector:
        matchLabels:
          env: production
      minDelay: 10
      maxDelay: 50

    # Add 100–200 ms delay to pods labeled role=slow in any namespace (empty selector matches all).
    - selector:
        matchLabels:
          role: slow
      minDelay: 100
      maxDelay: 200

    # Use matchExpressions for both pod and namespace selectors.
    - selector:
        matchExpressions:
          - key: environment
            operator: In
            values: [staging, canary]
      namespaceSelector:
        matchExpressions:
          - key: team
            operator: In
            values: [platform, infra]
      minDelay: 5
      maxDelay: 30

    # Add 20–80 ms delay on both the primary interface and a Multus-attached interface.
    - selector:
        matchLabels:
          app: worker
      minDelay: 20
      maxDelay: 80
      target:
        multusNetworks:
          - default/mynetwork  # "namespace/name" (exact) or "name" (any namespace)

    # Add 100–200 ms delay on a Multus interface ONLY (primary interface is skipped).
    - selector:
        matchLabels:
          app: multus-only
      minDelay: 100
      maxDelay: 200
      target:
        primary: false
        multusNetworks:
          - default/mynetwork
