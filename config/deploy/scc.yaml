apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: tc-injector
# NET_ADMIN and SYS_ADMIN are sufficient; a fully privileged container is not required.
allowPrivilegedContainer: false
# hostPID is required to access /proc/<pid>/ns/net of target containers.
allowHostPID: true
allowHostDirVolumePlugin: true
allowHostIPC: false
# hostNetwork is required so the DaemonSet pod shares the host's default
# network namespace, enabling netlink and tc(8) to reach host-side veth
# interfaces (e.g. OVN-Kubernetes ports under ovs-system).
allowHostNetwork: true
allowHostPorts: false
# NET_ADMIN is required for tc/netem operations.
# SYS_ADMIN is required for netlink and network namespace (setns) operations.
# SYS_PTRACE is required to pass the kernel's ptrace_may_access() check when
# opening /proc/<pid>/ns/net for containers running as a different UID.
allowedCapabilities:
  - NET_ADMIN
  - SYS_ADMIN
  - SYS_PTRACE
defaultAddCapabilities: []
requiredDropCapabilities: []
# Must run as root: setns(2) requires UID 0 or CAP_SYS_ADMIN.
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
  - hostPath
  - secret
  - configMap
  - emptyDir
  - projected
  - downwardAPI
users: []
groups: []
