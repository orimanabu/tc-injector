apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: tc-injector
# NET_ADMIN and SYS_ADMIN are sufficient; a fully privileged container is not required.
allowPrivilegedContainer: false
# hostPID is required to access /proc/<pid>/ns/net of target containers.
allowHostPID: true
allowHostDirVolumePlugin: true
allowHostIPC: false
# hostNetwork is not required: tc is applied inside pod network namespaces via nsenter,
# so the DaemonSet pod does not need to share the host's default network namespace.
allowHostNetwork: false
allowHostPorts: false
# NET_ADMIN is required for tc/netem operations run via nsenter inside the pod netns.
# SYS_ADMIN is required for nsenter to call setns(2) when entering pod network namespaces.
# SYS_PTRACE is required for nsenter to open /proc/<pid>/ns/net of other processes.
allowedCapabilities:
  - NET_ADMIN
  - SYS_ADMIN
  - SYS_PTRACE
defaultAddCapabilities: []
requiredDropCapabilities: []
# Must run as root: opening /proc/<pid>/ entries of other processes requires UID 0.
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
  - hostPath
  - secret
  - configMap
  - emptyDir
  - projected
  - downwardAPI
users: []
groups: []
